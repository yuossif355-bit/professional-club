<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Professional Academy | Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#04101f;
  --bg2:#071a2e;
  --panel:#08213a;
  --panel2:#0b2a49;
  --line:rgba(139,190,255,.16);
  --text:#f7fbff;
  --muted:#8da6bf;
  --yellow:#ffc21a;
  --yellow2:#ff9d00;
  --blue:#1687ff;
  --blue2:#005be8;
  --green:#2ee7a1;
  --red:#ff4d5e;
  --shadow:0 20px 55px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;color:var(--text);font-family:Cairo,Arial,sans-serif;
  background:
    radial-gradient(circle at 20% 10%,rgba(0,120,255,.16),transparent 28%),
    radial-gradient(circle at 85% 35%,rgba(255,184,0,.09),transparent 24%),
    linear-gradient(135deg,#020a14,#06182b 55%,#03101e);
  min-height:100vh;
}
button,input,select{font:inherit}
button{cursor:pointer}
.app{display:grid;grid-template-columns:270px 1fr;min-height:100vh}
.sidebar{
  position:sticky;top:0;height:100vh;padding:24px 18px;
  background:linear-gradient(180deg,#03101f,#061c32 70%,#04101d);
  border-left:1px solid var(--line);z-index:20;
}
.brand{display:flex;align-items:center;gap:12px;padding:8px 8px 25px}
.brand-mark{
  width:62px;height:62px;border-radius:20px;display:grid;place-items:center;
  background:linear-gradient(145deg,var(--yellow),#ff8d00);
  color:#06111e;font-weight:900;font-family:Montserrat;font-size:24px;
  box-shadow:0 10px 30px rgba(255,183,0,.24);
  transform:skew(-4deg);
}
.brand strong{display:block;font-family:Montserrat;font-size:19px;letter-spacing:.2px}
.brand span{display:block;color:var(--yellow);font-size:11px;font-weight:800;margin-top:2px}

/* تنسيق شريط الفلترة والأقسام */
.main-content { padding: 30px; }
.filter-box {
  background: var(--panel);
  padding: 15px 20px;
  border-radius: 12px;
  border: 1px solid var(--line);
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 15px;
}
.filter-box select {
  background: var(--panel2);
  color: var(--text);
  border: 1px solid var(--line);
  padding: 8px 16px;
  border-radius: 8px;
  outline: none;
  cursor: pointer;
}
.data-card {
  background: var(--panel);
  border: 1px solid var(--line);
  padding: 15px;
  border-radius: 10px;
  margin-bottom: 10px;
}
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">PA</div>
      <div>
        <strong>ACADEMY</strong>
        <span>DASHBOARD</span>
      </div>
    </div>
  </aside>

  <main class="main-content">
    <!-- قائمة اختيار الشهر -->
    <div class="filter-box">
      <label for="monthFilter">اختر الشهر عرض البيانات:</label>
      <select id="monthFilter" onchange="filterData()">
        <option value="all">جميع الشهور</option>
        <option value="1">شهر 1 (يناير)</option>
        <option value="2">شهر 2 (فبراير)</option>
        <option value="3">شهر 3 (مارس)</option>
        <option value="4">شهر 4 (أبريل)</option>
        <option value="5">شهر 5 (مايو)</option>
        <option value="6">شهر 6 (يونيو)</option>
        <option value="7">شهر 7 (يوليو)</option>
        <option value="8">شهر 8 (أغسطس)</option>
        <option value="9">شهر 9 (سبتمبر)</option>
        <option value="10">شهر 10 (أكتوبر)</option>
        <option value="11">شهر 11 (نوفمبر)</option>
        <option value="12">شهر 12 (ديسمبر)</option>
      </select>
    </div>

    <!-- قائمة البيانات المسجلة -->
    <div id="dataList">
      <!-- يتم تحديد الشهر باستخدام data-month -->
      <div class="data-card" data-month="1">
        <h3>تسجيل طالب جديد</h3>
        <p>التاريخ: 15 يناير</p>
      </div>

      <div class="data-card" data-month="1">
        <h3>دفعة رسم دورة تدريبية</h3>
        <p>التاريخ: 20 يناير</p>
      </div>

      <div class="data-card" data-month="2">
        <h3>اشتراك جديد</h3>
        <p>التاريخ: 10 فبراير</p>
      </div>

      <div class="data-card" data-month="3">
        <h3>تقرير شهر مارس</h3>
        <p>التاريخ: 5 مارس</p>
      </div>
    </div>
  </main>
</div>

<!-- كود السكربت لتصفية العناصر -->
<script>
function filterData() {
  // الحصول على الشهر المحدد من القائمة
  const selectedMonth = document.getElementById("monthFilter").value;
  
  // الحصول على كل بطاقات البيانات
  const cards = document.querySelectorAll(".data-card");

  cards.forEach(card => {
    // قراءة رقم الشهر الخاص بكل عنصر من خاصية data-month
    const itemMonth = card.getAttribute("data-month");

    // إظهار العنصر إذا كان يساوي الشهر المحدد أو تم اختيار "جميع الشهور"
    if (selectedMonth === "all" || itemMonth === selectedMonth) {
      card.style.display = "block";
    } else {
      card.style.display = "none";
    }
  });
}
</script>

</body>
</html>
