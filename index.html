<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أكاديمية بروفيشنال الرياضية - إدارة الفرق والاشتراكات</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131b2e;
            --border-color: #1e293b;
            --primary: #3b82f6;
            --accent-handball: #f59e0b;
            --accent-basketball: #ea580c;
            --accent-volleyball: #06b6d4;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
            --danger: #ef4444;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            text-align: center;
        }

        header {
            background: linear-gradient(135deg, #090d16, #132247, #1e3a8a);
            padding: 35px 20px;
            border-bottom: 4px solid var(--primary);
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            position: relative;
            overflow: hidden;
        }
        
        header h1 {
            margin: 10px 0 5px 0;
            color: #ffffff;
            font-size: 34px;
            font-weight: 900;
            letter-spacing: 1px;
            text-shadow: 0 3px 10px rgba(59, 130, 246, 0.4);
        }
        .subtitle {
            color: #93c5fd;
            font-size: 15px;
            font-weight: 600;
            text-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        .container {
            padding: 30px 15px;
            max-width: 850px;
            margin: 0 auto;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            text-align: right;
        }
        .card h3 {
            color: #ffffff;
            margin-top: 0;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 12px;
            font-size: 20px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        @media (max-width: 600px) {
            .form-grid { grid-template-columns: 1fr; }
        }

        .form-group {
            margin-bottom: 15px;
        }
        .form-group.full {
            grid-column: span 2;
        }
        @media (max-width: 600px) {
            .form-group.full { grid-column: span 1; }
        }

        .form-group label {
            display: block;
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 6px;
            font-weight: 600;
        }
        .form-control {
            width: 100%;
            padding: 12px 15px;
            background-color: #0b0f19;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: #fff;
            font-size: 15px;
            font-family: 'Cairo', sans-serif;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }
        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        .btn {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: 700;
            font-family: 'Cairo', sans-serif;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s, opacity 0.2s;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }
        .btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        /* الجدول والتصميم الرياضي */
        .table-responsive {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            text-align: right;
            font-size: 14px;
        }
        th, td {
            padding: 14px 15px;
            border-bottom: 1px solid var(--border-color);
        }
        th {
            background-color: #1a233a;
            color: var(--primary);
            font-weight: 700;
        }
        tr:hover {
            background-color: rgba(255,255,255,0.02);
        }

        /* شارات الألعاب التخصصية */
        .badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            display: inline-block;
        }
        .badge-handball { background-color: rgba(245, 158, 11, 0.15); color: var(--accent-handball); border: 1px solid rgba(245, 158, 11, 0.3); }
        .badge-basketball { background-color: rgba(234, 88, 12, 0.15); color: var(--accent-basketball); border: 1px solid rgba(234, 88, 12, 0.3); }
        .badge-volleyball { background-color: rgba(6, 182, 212, 0.15); color: var(--accent-volleyball); border: 1px solid rgba(6, 182, 212, 0.3); }

        .status-paid { color: var(--success); font-weight: 700; }
        .status-unpaid { color: var(--danger); font-weight: 700; }

        .date-text {
            color: var(--text-muted);
            font-size: 13px;
            display: block;
            margin-top: 3px;
        }

        .delete-btn {
            background: rgba(239, 68, 68, 0.15);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-weight: 600;
            transition: 0.2s;
        }
        .delete-btn:hover {
            background: var(--danger);
            color: white;
        }

        .footer {
            margin-top: 40px;
            padding: 20px;
            color: var(--text-muted);
            font-size: 13px;
            border-top: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

    <header>
        <!-- لوجو واسع ومضبوط يضمن ظهور جميع الحروف بكامل إطاراتها -->
        <svg width="100%" max-width="460" height="110" viewBox="0 0 460 110" xmlns="http://www.w3.org/2000/svg" style="margin-bottom: 5px; filter: drop-shadow(0 10px 20px rgba(0,0,0,0.6);">
            <!-- إطار درع متسع بالكامل للاسم -->
            <path d="M15 15 L445 15 L445 80 C445 100, 230 100, 230 100 C230 100, 15 100, 15 80 Z" fill="url(#shieldGrad)" stroke="#3b82f6" stroke-width="3"/>
            
            <defs>
                <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#131b2e"/>
                    <stop offset="50%" stop-color="#1e3a8a"/>
                    <stop offset="100%" stop-color="#0b0f19"/>
                </linearGradient>
                <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#60a5fa"/>
                    <stop offset="50%" stop-color="#ffffff"/>
                    <stop offset="100%" stop-color="#f59e0b"/>
                </linearGradient>
            </defs>

            <!-- خطوط تزيينية حماسية -->
            <line x1="40" y1="26" x2="420" y2="26" stroke="#f59e0b" stroke-width="1.5" opacity="0.6"/>
            <line x1="60" y1="88" x2="400" y2="88" stroke="#3b82f6" stroke-width="1.5" opacity="0.6"/>

            <!-- اسم الأكاديمية كامل (Professional Academy) ومقاس الخط مظبوط تماماً في المنتصف -->
            <text x="230" y="64" font-family="'Montserrat', sans-serif" font-size="31" font-weight="900" fill="url(#textGrad)" text-anchor="middle" letter-spacing="1.5">PROFESSIONAL ACADEMY</text>
        </svg>
        
        <h1>أكاديمية بروفيشنال الرياضية 🏆</h1>
        <div class="subtitle">النظام الاحترافي لإدارة فرق: (كرة اليد 🤾‍♂️ - كرة السلة 🏀 - كرة الطائرة 🏐)</div>
    </header>

    <div class="container">

        <!-- صندوق تسجيل مشترك جديد -->
        <div class="card">
            <h3>➕ تسجيل لاعب وفريق جديد</h3>
            <div class="form-grid">
                <div class="form-group">
                    <label>اسم اللاعب:</label>
                    <input type="text" id="playerName" class="form-control" placeholder="اكتب اسم اللاعب ثلاثي...">
                </div>
                <div class="form-group">
                    <label>التخصص (اللعبة):</label>
                    <select id="playerSport" class="form-control">
                        <option value="كرة يد 🤾‍♂️">كرة يد 🤾‍♂️</option>
                        <option value="كرة سلة 🏀">كرة سلة 🏀</option>
                        <option value="كرة طائرة 🏐">كرة طائرة 🏐</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>رقم الهاتف:</label>
                    <input type="text" id="playerPhone" class="form-control" placeholder="01xxxxxxxx0">
                </div>
                <div class="form-group">
                    <label>حالة الاشتراك:</label>
                    <select id="playerStatus" class="form-control">
                        <option value="تم الدفع (مدفوع) ✅">تم الدفع (مدفوع) ✅</option>
                        <option value="مستحق الدفع (غير مدفوع) ⏳">مستحق الدفع (غير مدفوع) ⏳</option>
                    </select>
                </div>
                <div class="form-group full">
                    <label>تاريخ دفع الاشتراك:</label>
                    <input type="date" id="playerDate" class="form-control">
                </div>
            </div>
            <button class="btn" onclick="addMember()">حفظ وتسجيل اللاعب في الأكاديمية 🚀</button>
        </div>

        <!-- سجل المشتركين -->
        <div class="card">
            <h3>📋 سجل المشتركين والفرق الرياضية</h3>
            <div class="form-group" style="margin-bottom: 20px;">
                <input type="text" id="searchInput" class="form-control" placeholder="🔍 ابحث باسم اللاعب أو اللعبة..." onkeyup="searchMember()">
            </div>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>اسم اللاعب</th>
                            <th>التخصص</th>
                            <th>الهاتف</th>
                            <th>الاشتراك وتاريخه</th>
                            <th>إجراء</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <!-- بيانات المشتركين -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <div class="footer">
        جميع الحقوق محفوظة © 2026 - Professional Academy System ⚡
    </div>

    <script>
        // ضبط تاريخ اليوم افتراضياً في خانة التاريخ
        document.getElementById('playerDate').valueAsDate = new Date();

        // جلب البيانات من الذاكرة المحلية (تظل محفوظة دائماً)
        let members = JSON.parse(localStorage.getItem("academyMembers")) || [];

        window.onload = function() {
            renderTable(members);
        };

        function addMember() {
            let name = document.getElementById("playerName").value.trim();
            let sport = document.getElementById("playerSport").value;
            let phone = document.getElementById("playerPhone").value.trim();
            let status = document.getElementById("playerStatus").value;
            let date = document.getElementById("playerDate").value;

            if (name === "" || phone === "" || date === "") {
                alert("من فضلك أكمل بيانات اللاعب (الاسم، الهاتف، وتاريخ الدفع)!");
                return;
            }

            let newMember = { name: name, sport: sport, phone: phone, status: status, date: date };
            members.unshift(newMember);

            localStorage.setItem("academyMembers", JSON.stringify(members));
            renderTable(members);

            // تفريغ خانات الإدخال مع الحفاظ على تاريخ اليوم
            document.getElementById("playerName").value = "";
            document.getElementById("playerPhone").value = "";
            document.getElementById('playerDate').valueAsDate = new Date();

            alert("تم حفظ وتسجيل بيانات اللاعب بنجاح في أكاديمية بروفيشنال! 🏆");
        }

        function renderTable(dataArray) {
            let tbody = document.getElementById("tableBody");
            tbody.innerHTML = "";

            if (dataArray.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:var(--text-muted); padding:30px;">لا توجد سجلات حالياً، ابدأ بإضافة لاعب جديد 🏟️</td></tr>`;
                return;
            }

            dataArray.forEach((member, index) => {
                let badgeClass = "";
                if (member.sport.includes("يد")) badgeClass = "badge-handball";
                else if (member.sport.includes("سلة")) badgeClass = "badge-basketball";
                else badgeClass = "badge-volleyball";

                let statusClass = member.status.includes("مدفوع") && !member.status.includes("غير") ? "status-paid" : "status-unpaid";

                let row = `
                    <tr>
                        <td><b style="font-size: 15px;">${member.name}</b></td>
                        <td><span class="badge ${badgeClass}">${member.sport}</span></td>
                        <td>${member.phone}</td>
                        <td>
                            <span class="${statusClass}">${member.status}</span>
                            <span class="date-text">📅 تاريخ الدفع: ${member.date}</span>
                        </td>
                        <td><button class="delete-btn" onclick="deleteMember(${index})">حذف</button></td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });
        }

        function searchMember() {
            let query = document.getElementById("searchInput").value.toLowerCase();
            let filtered = members.filter(m => m.name.toLowerCase().includes(query) || m.sport.toLowerCase().includes(query));
            renderTable(filtered);
        }

        function deleteMember(index) {
            if (confirm("هل أنت متأكد من حذف هذا المشترك من السجل؟")) {
                members.splice(index, 1);
                localStorage.setItem("academyMembers", JSON.stringify(members));
                renderTable(members);
            }
        }
    </script>

</body>
</html>
