<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نادي بروفيشنال الرياضي - إدارة الفرق والاشتراكات</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d1117;
            color: #ffffff;
            margin: 0;
            padding: 0;
            text-align: center;
        }
        header {
            background: linear-gradient(135deg, #161b22, #1f6feb);
            padding: 25px 20px;
            border-bottom: 3px solid #58a6ff;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
        }
        header h1 {
            margin: 0;
            color: #58a6ff;
            font-size: 28px;
        }
        .subtitle {
            color: #8b949e;
            font-size: 15px;
            margin-top: 8px;
        }
        .container {
            padding: 20px;
            max-width: 700px;
            margin: 0 auto;
        }
        .card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 6px 14px rgba(0,0,0,0.3);
            text-align: right;
        }
        .card h3 {
            color: #f0f6fc;
            margin-top: 0;
            border-bottom: 1px solid #30363d;
            padding-bottom: 8px;
            font-size: 18px;
        }
        .form-group {
            margin-bottom: 12px;
        }
        .form-group label {
            display: block;
            color: #8b949e;
            font-size: 14px;
            margin-bottom: 5px;
        }
        .form-control {
            width: 100%;
            padding: 10px 12px;
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #fff;
            font-size: 15px;
            box-sizing: border-box;
        }
        .form-control:focus {
            outline: none;
            border-color: #58a6ff;
        }
        .btn {
            background-color: #238636;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        .btn:hover {
            background-color: #2ea043;
        }
        .table-responsive {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            text-align: right;
            font-size: 14px;
        }
        th, td {
            padding: 10px 12px;
            border-bottom: 1px solid #30363d;
        }
        th {
            background-color: #21262d;
            color: #58a6ff;
        }
        tr:hover {
            background-color: #1f242c;
        }
        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }
        .badge-handball { background-color: #9e6a03; color: #fff; }
        .badge-basketball { background-color: #bc4c00; color: #fff; }
        .badge-volleyball { background-color: #1f6feb; color: #fff; }
        
        .search-box {
            margin-bottom: 15px;
        }
        .footer {
            margin-top: 40px;
            padding: 15px;
            color: #8b949e;
            font-size: 13px;
            border-top: 1px solid #21262d;
        }
    </style>
</head>
<body>

    <header>
        <h1>نادي بروفيشنال الرياضي 🏆</h1>
        <div class="subtitle">نظام إدارة اشتراكات الفرق (كرة يد - كرة سلة - كرة طائرة)</div>
    </header>

    <div class="container">

        <div class="card">
            <h3>➕ تسجيل مشترك جديد</h3>
            <div class="form-group">
                <label>اسم اللاعب:</label>
                <input type="text" id="playerName" class="form-control" placeholder="اكتب اسم اللاعب ثلاثي...">
            </div>
            <div class="form-group">
                <label>التخصص (اللعبة):</label>
                <select id="playerSport" class="form-control">
                    <option value="كرة يد 🤾‍♂️">كرة يد 🤾‍♂️</option>
                    <option value="كرة سلة 🏀">كرة سلة 🏀</option>
                    <option value="كرة طائرة 🏐">كرة طائرة 🏐</option>
                </select>
            </div>
            <div class="form-group">
                <label>رقم الهاتف:</label>
                <input type="text" id="playerPhone" class="form-control" placeholder="01xxxxxxxx0">
            </div>
            <div class="form-group">
                <label>حالة الاشتراك:</label>
                <select id="playerStatus" class="form-control">
                    <option value="تم الدفع (مدفوع) ✅">تم الدفع (مدفوع) ✅</option>
                    <option value="مستحق الدفع (غير مدفوع) ⏳">مستحق الدفع (غير مدفوع) ⏳</option>
                </select>
            </div>
            <button class="btn" onclick="addMember()">حفظ وتسجيل اللاعب 🚀</button>
        </div>

        <div class="card">
            <h3>📋 سجل المشتركين في النادي</h3>
            <div class="search-box">
                <input type="text" id="searchInput" class="form-control" placeholder="🔍 ابحث باسم اللاعب هنا..." onkeyup="searchMember()">
            </div>
            <div class="table-responsive">
                <table id="membersTable">
                    <thead>
                        <tr>
                            <th>اسم اللاعب</th>
                            <th>التخصص</th>
                            <th>الهاتف</th>
                            <th>الاشتراك</th>
                            <th>إجراء</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <div class="footer">
        جميع الحقوق محفوظة © 2026 - Professional Club System 🛡️
    </div>

    <script>
        let members = [
            { name: "أحمد إبراهيم", sport: "كرة يد 🤾‍♂️", phone: "01000000000", status: "تم الدفع (مدفوع) ✅" },
            { name: "محمد محمود", sport: "كرة سلة 🏀", phone: "01111111111", status: "مستحق الدفع (غير مدفوع) ⏳" },
            { name: "محمود حسن", sport: "كرة طائرة 🏐", phone: "01222222222", status: "تم الدفع (مدفوع) ✅" }
        ];

        window.onload = function() {
            renderTable(members);
        };

        function addMember() {
            let name = document.getElementById("playerName").value.trim();
            let sport = document.getElementById("playerSport").value;
            let phone = document.getElementById("playerPhone").value.trim();
            let status = document.getElementById("playerStatus").value;

            if (name === "" || phone === "") {
                alert("من فضلك اكتب اسم اللاعب ورقم الهاتف!");
                return;
            }

            let newMember = { name: name, sport: sport, phone: phone, status: status };
            members.unshift(newMember);

            renderTable(members);

            document.getElementById("playerName").value = "";
            document.getElementById("playerPhone").value = "";

            alert("تم تسجيل اللاعب بنجاح في نادي بروفيشنال! 🏆");
        }

        function renderTable(dataArray) {
            let tbody = document.getElementById("tableBody");
            tbody.innerHTML = "";

            if (dataArray.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#8b949e;">لا توجد نتائج مطابقة</td></tr>`;
                return;
            }

            dataArray.forEach((member, index) => {
                let badgeClass = "";
                if (member.sport.includes("يد")) badgeClass = "badge-handball";
                else if (member.sport.includes("سلة")) badgeClass = "badge-basketball";
                else badgeClass = "badge-volleyball";

                let row = `
                    <tr>
                        <td><b>${member.name}</b></td>
                        <td><span class="badge ${badgeClass}">${member.sport}</span></td>
                        <td>${member.phone}</td>
                        <td>${member.status}</td>
                        <td><button onclick="deleteMember(${index})" style="background:#da3633; color:white; border:none; padding:5px 10px; border-radius:4px; cursor:pointer;">حذف</button></td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });
        }

        function searchMember() {
            let query = document.getElementById("searchInput").value.toLowerCase();
            let filtered = members.filter(m => m.name.toLowerCase().includes(query) || m.sport.toLowerCase().includes(query));
            renderTable(filtered);
        }

        function deleteMember(index) {
            if (confirm("هل أنت متأكد من حذف هذا المشترك من النادي؟")) {
                members.splice(index, 1);
                renderTable(members);
            }
        }
    </script>

</body>
</html>
