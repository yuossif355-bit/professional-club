<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أكاديمية بروفيشنال الرياضية - إدارة الفرق والاشتراكات</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
    <style>

        :root {
            --bg: #07111f;
            --bg2: #0b1b2f;
            --panel: rgba(15, 31, 51, .88);
            --panel2: #10243b;
            --line: rgba(148, 163, 184, .16);
            --white: #f8fafc;
            --muted: #91a4b8;
            --blue: #38bdf8;
            --blue2: #2563eb;
            --orange: #fb923c;
            --green: #22c55e;
            --red: #ef4444;
            --cyan: #22d3ee;
        }

        * { box-sizing: border-box; }

        html { scroll-behavior: smooth; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Cairo', sans-serif;
            color: var(--white);
            text-align: center;
            background:
                radial-gradient(circle at 15% 10%, rgba(37,99,235,.20), transparent 30%),
                radial-gradient(circle at 85% 15%, rgba(34,211,238,.12), transparent 25%),
                linear-gradient(145deg, #050b14 0%, #071525 48%, #06101d 100%);
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            opacity: .06;
            background-image:
                linear-gradient(rgba(255,255,255,.5) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,.5) 1px, transparent 1px);
            background-size: 42px 42px;
            mask-image: linear-gradient(to bottom, black, transparent 75%);
        }

        header {
            position: relative;
            overflow: hidden;
            padding: 28px 20px 34px;
            border-bottom: 1px solid rgba(56,189,248,.35);
            background:
                linear-gradient(135deg, rgba(5,15,28,.96), rgba(8,34,59,.92)),
                radial-gradient(circle at 50% 0%, rgba(56,189,248,.18), transparent 45%);
            box-shadow: 0 25px 70px rgba(0,0,0,.45);
        }

        header::before, header::after {
            content: "";
            position: absolute;
            width: 260px;
            height: 260px;
            border: 1px solid rgba(56,189,248,.12);
            border-radius: 50%;
            pointer-events: none;
        }
        header::before { left: -130px; top: -120px; }
        header::after { right: -130px; top: -120px; }

        header h1 {
            position: relative;
            margin: 8px 0 4px;
            font-size: clamp(26px, 5vw, 40px);
            font-weight: 900;
            letter-spacing: .5px;
            background: linear-gradient(90deg, #fff, #7dd3fc, #38bdf8);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 10px 30px rgba(56,189,248,.18);
        }

        .subtitle {
            position: relative;
            color: #a9bfd3;
            font-size: 14px;
            font-weight: 600;
        }

        .container {
            position: relative;
            z-index: 1;
            width: min(1120px, calc(100% - 28px));
            margin: 0 auto;
            padding: 28px 0 10px;
        }

        .card {
            position: relative;
            overflow: hidden;
            background: linear-gradient(145deg, rgba(16,36,59,.94), rgba(8,23,40,.94));
            border: 1px solid var(--line);
            border-radius: 22px;
            padding: 24px;
            margin-bottom: 22px;
            box-shadow: 0 18px 50px rgba(0,0,0,.25);
            text-align: right;
            backdrop-filter: blur(12px);
        }

        .card::before {
            content: "";
            position: absolute;
            right: 0;
            top: 0;
            width: 130px;
            height: 3px;
            background: linear-gradient(90deg, var(--blue2), var(--cyan), transparent);
        }

        .card h3 {
            margin: 0 0 22px;
            padding-bottom: 14px;
            color: #fff;
            border-bottom: 1px solid var(--line);
            font-size: 19px;
            font-weight: 900;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 17px;
        }

        .form-group { margin-bottom: 8px; }

        .form-group.full { grid-column: span 2; }

        .form-group label {
            display: block;
            color: #a8b9c9;
            font-size: 13px;
            margin-bottom: 7px;
            font-weight: 700;
        }

        .form-control {
            width: 100%;
            padding: 13px 15px;
            background: rgba(3,12,23,.72);
            border: 1px solid rgba(148,163,184,.17);
            border-radius: 12px;
            color: #fff;
            font-size: 14px;
            font-family: 'Cairo', sans-serif;
            outline: none;
            transition: .25s ease;
        }

        .form-control:hover { border-color: rgba(56,189,248,.35); }

        .form-control:focus {
            border-color: var(--blue);
            box-shadow: 0 0 0 4px rgba(56,189,248,.10), 0 8px 25px rgba(0,0,0,.18);
            transform: translateY(-1px);
        }

        .btn {
            position: relative;
            overflow: hidden;
            margin-top: 8px;
            background: linear-gradient(135deg, #2563eb, #0891b2);
            color: white;
            border: 0;
            padding: 14px 20px;
            font-size: 15px;
            font-weight: 900;
            font-family: 'Cairo', sans-serif;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            transition: .25s ease;
            box-shadow: 0 10px 25px rgba(37,99,235,.22);
        }

        .btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.08);
            box-shadow: 0 14px 32px rgba(37,99,235,.30);
        }

        .btn:active { transform: translateY(0); }

        .table-responsive {
            overflow-x: auto;
            border-radius: 14px;
            border: 1px solid var(--line);
        }

        table {
            width: 100%;
            min-width: 680px;
            border-collapse: collapse;
            text-align: right;
            font-size: 13px;
            background: rgba(3,12,23,.28);
        }

        th, td {
            padding: 15px 14px;
            border-bottom: 1px solid rgba(148,163,184,.10);
        }

        th {
            background: #102a44;
            color: #7dd3fc;
            font-weight: 900;
            font-size: 12px;
        }

        tr { transition: .2s ease; }
        tr:hover { background: rgba(56,189,248,.045); }

        .badge {
            padding: 6px 11px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 900;
            display: inline-block;
            white-space: nowrap;
        }

        .badge-handball {
            background: rgba(251,146,60,.12);
            color: #fb923c;
            border: 1px solid rgba(251,146,60,.25);
        }

        .badge-basketball {
            background: rgba(239,68,68,.12);
            color: #fb7185;
            border: 1px solid rgba(239,68,68,.25);
        }

        .badge-volleyball {
            background: rgba(34,211,238,.12);
            color: #22d3ee;
            border: 1px solid rgba(34,211,238,.25);
        }

        .status-paid {
            color: #4ade80;
            font-weight: 900;
        }

        .status-unpaid {
            color: #fb7185;
            font-weight: 900;
        }

        .date-text {
            color: #8195aa;
            font-size: 11px;
            display: block;
            margin-top: 4px;
        }

        .delete-btn {
            background: rgba(239,68,68,.08);
            color: #fb7185;
            border: 1px solid rgba(239,68,68,.22);
            padding: 7px 12px;
            border-radius: 9px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-weight: 800;
            transition: .2s;
        }

        .delete-btn:hover {
            background: #ef4444;
            color: #fff;
            transform: translateY(-1px);
        }

        .footer {
            margin-top: 35px;
            padding: 22px;
            color: #70869b;
            font-size: 12px;
            border-top: 1px solid var(--line);
            background: rgba(3,10,18,.35);
        }

        @media (max-width: 700px) {
            .container { width: min(100% - 18px, 1120px); padding-top: 18px; }
            .card { padding: 18px; border-radius: 17px; }
            .form-grid { grid-template-columns: 1fr; }
            .form-group.full { grid-column: span 1; }
            header { padding: 22px 12px 28px; }
        }

    </style>
</head>
<body>

    <header>
        <svg width="100%" height="105" viewBox="0 0 620 105" xmlns="http://www.w3.org/2000/svg" style="max-width:620px; margin-bottom:4px;">
            <defs>
                <linearGradient id="sportLogo" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="#38bdf8"/>
                    <stop offset="55%" stop-color="#2563eb"/>
                    <stop offset="100%" stop-color="#22d3ee"/>
                </linearGradient>
            </defs>
            <rect x="12" y="12" width="596" height="78" rx="20" fill="#0b1b2f" stroke="#214563"/>
            <circle cx="75" cy="51" r="27" fill="none" stroke="url(#sportLogo)" stroke-width="3"/>
            <path d="M58 51h34M75 34v34" stroke="#7dd3fc" stroke-width="2" opacity=".8"/>
            <text x="325" y="62" text-anchor="middle" font-family="Montserrat, sans-serif" font-size="31" font-weight="900" fill="url(#sportLogo)" letter-spacing="2">PROFESSIONAL ACADEMY</text>
            <path d="M548 30l16 21-16 21-16-21z" fill="none" stroke="#fb923c" stroke-width="3"/>
        </svg>
        <h1>أكاديمية بروفيشنال الرياضية 🏆</h1>
        <div class="subtitle">إدارة احترافية لفرق كرة اليد 🤾‍♂️ · كرة السلة 🏀 · كرة الطائرة 🏐</div>
    </header>

    <div class="container">

        <!-- صندوق تسجيل مشترك جديد -->
        <div class="card">
            <h3>➕ تسجيل لاعب وفريق جديد</h3>
            <div class="form-grid">
                <div class="form-group">
                    <label>اسم اللاعب:</label>
                    <input type="text" id="playerName" class="form-control" placeholder="اكتب اسم اللاعب ثلاثي...">
                </div>
                <div class="form-group">
                    <label>التخصص (اللعبة):</label>
                    <select id="playerSport" class="form-control">
                        <option value="كرة يد 🤾‍♂️">كرة يد 🤾‍♂️</option>
                        <option value="كرة سلة 🏀">كرة سلة 🏀</option>
                        <option value="كرة طائرة 🏐">كرة طائرة 🏐</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>رقم الهاتف:</label>
                    <input type="text" id="playerPhone" class="form-control" placeholder="01xxxxxxxx0">
                </div>
                <div class="form-group">
                    <label>حالة الاشتراك:</label>
                    <select id="playerStatus" class="form-control">
                        <option value="تم الدفع (مدفوع) ✅">تم الدفع (مدفوع) ✅</option>
                        <option value="مستحق الدفع (غير مدفوع) ⏳">مستحق الدفع (غير مدفوع) ⏳</option>
                    </select>
                </div>
                <div class="form-group full">
                    <label>تاريخ دفع الاشتراك:</label>
                    <input type="date" id="playerDate" class="form-control">
                </div>
            </div>
            <button class="btn" onclick="addMember()">حفظ وتسجيل اللاعب في الأكاديمية 🚀</button>
        </div>

        <!-- سجل المشتركين -->
        <div class="card">
            <h3>📋 سجل المشتركين والفرق الرياضية</h3>
            <div class="form-group" style="margin-bottom: 20px;">
                <input type="text" id="searchInput" class="form-control" placeholder="🔍 ابحث باسم اللاعب أو اللعبة..." onkeyup="searchMember()">
            </div>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>اسم اللاعب</th>
                            <th>التخصص</th>
                            <th>الهاتف</th>
                            <th>الاشتراك وتاريخه</th>
                            <th>إجراء</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <!-- بيانات المشتركين -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <div class="footer">
        جميع الحقوق محفوظة © 2026 - Professional Academy System ⚡
    </div>

    <script>
        // ضبط تاريخ اليوم افتراضياً في خانة التاريخ
        document.getElementById('playerDate').valueAsDate = new Date();

        // جلب البيانات من الذاكرة المحلية (تظل محفوظة دائماً)
        let members = JSON.parse(localStorage.getItem("academyMembers")) || [];

        window.onload = function() {
            renderTable(members);
        };

        function addMember() {
            let name = document.getElementById("playerName").value.trim();
            let sport = document.getElementById("playerSport").value;
            let phone = document.getElementById("playerPhone").value.trim();
            let status = document.getElementById("playerStatus").value;
            let date = document.getElementById("playerDate").value;

            if (name === "" || phone === "" || date === "") {
                alert("من فضلك أكمل بيانات اللاعب (الاسم، الهاتف، وتاريخ الدفع)!");
                return;
            }

            let newMember = { name: name, sport: sport, phone: phone, status: status, date: date };
            members.unshift(newMember);

            localStorage.setItem("academyMembers", JSON.stringify(members));
            renderTable(members);

            // تفريغ خانات الإدخال مع الحفاظ على تاريخ اليوم
            document.getElementById("playerName").value = "";
            document.getElementById("playerPhone").value = "";
            document.getElementById('playerDate').valueAsDate = new Date();

            alert("تم حفظ وتسجيل بيانات اللاعب بنجاح في أكاديمية بروفيشنال! 🏆");
        }

        function renderTable(dataArray) {
            let tbody = document.getElementById("tableBody");
            tbody.innerHTML = "";

            if (dataArray.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:var(--text-muted); padding:30px;">لا توجد سجلات حالياً، ابدأ بإضافة لاعب جديد 🏟️</td></tr>`;
                return;
            }

            dataArray.forEach((member, index) => {
                let badgeClass = "";
                if (member.sport.includes("يد")) badgeClass = "badge-handball";
                else if (member.sport.includes("سلة")) badgeClass = "badge-basketball";
                else badgeClass = "badge-volleyball";

                let statusClass = member.status.includes("مدفوع") && !member.status.includes("غير") ? "status-paid" : "status-unpaid";

                let row = `
                    <tr>
                        <td><b style="font-size: 15px;">${member.name}</b></td>
                        <td><span class="badge ${badgeClass}">${member.sport}</span></td>
                        <td>${member.phone}</td>
                        <td>
                            <span class="${statusClass}">${member.status}</span>
                            <span class="date-text">📅 تاريخ الدفع: ${member.date}</span>
                        </td>
                        <td><button class="delete-btn" onclick="deleteMember(${index})">حذف</button></td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });
        }

        function searchMember() {
            let query = document.getElementById("searchInput").value.toLowerCase();
            let filtered = members.filter(m => m.name.toLowerCase().includes(query) || m.sport.toLowerCase().includes(query));
            renderTable(filtered);
        }

        function deleteMember(index) {
            if (confirm("هل أنت متأكد من حذف هذا المشترك من السجل؟")) {
                members.splice(index, 1);
                localStorage.setItem("academyMembers", JSON.stringify(members));
                renderTable(members);
            }
        }
    </script>

</body>
</html>
